# bin-astro-template:demo
# Portada DE DEMOSTRACIÓN del template: todo este contenido es relleno.
# No la edites para convertirla en el sitio real: cuando empieces el diseño,
# pídele a tu agente "crea el home" (skill disenar-sitio) o corre
# `pnpm demo:clear`, que la borra junto con src/assets/images/demo-*.
# Guía: docs/guias/disenar-el-sitio.md
title: Bienvenido a Bin Astro Template
description: >-
  Portada de demostración del template. Muestra un par de bloques de ejemplo y
  explica las dos formas de diseñar el sitio real: desde Figma o con Hallmark.
updatedAt: 2026-09-29

sections:
  - type: hero
    id: hero
    eyebrow: Contenido de ejemplo
    heading: Esta página es relleno y se va a borrar
    body: >-
      Es la portada de demostración de Bin Astro Template. Sirve para ver cómo
      se arma una página con bloques antes de diseñar el sitio real. Cuando le
      pidas a tu agente de IA "crea el home", este contenido se elimina.
    image:
      src: ../../../assets/images/demo-hero.jpg
      alt: Ilustración abstracta de una página web sobre un fondo azul
    cta:
      label: Ver las dos formas de diseñar
      href: "#como-disenar"
    secondaryCta:
      label: Qué pedirle al agente
      href: "#siguiente-paso"

  - type: features
    id: como-disenar
    eyebrow: Dos caminos
    heading: Dos formas de diseñar tu sitio
    body: >-
      Elige una. En las dos, el contenido termina en archivos YAML de
      src/content/ y el código pasa las mismas revisiones automáticas.
    items:
      - title: "Opción 1: desde Figma"
        body: >-
          Conecta tu archivo con FIGMA_API_KEY y FIGMA_FILE_KEY en .env. El
          agente lee cada frame por su node-id y construye el sitio página por
          página.
      - title: "Opción 2: con Hallmark"
        body: >-
          Si no tienes un diseño previo, el agente de tu IDE usa la skill
          Hallmark para proponer un diseño con criterio y lo implementa con las
          secciones del template.
      - title: Lo que aporta el template
        body: >-
          La infraestructura: secciones validadas, SEO técnico, formularios,
          idiomas, integración con Binflow y revisiones automáticas. La
          estructura y el contenido del sitio los construyes tú desde cero.

  - type: cta
    id: siguiente-paso
    heading: Pídele a tu agente "crea el home"
    body: >-
      Te preguntará qué camino prefieres, borrará esta portada de ejemplo y
      construirá la real contigo.
    cta:
      label: Leer la guía de diseño
      href: https://github.com/arrobabeto/Bin-Astro-Template/blob/main/docs/guias/disenar-el-sitio.md
